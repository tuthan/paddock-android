# JVM tests, unit tests, lint and the debug APK; emulator and physical tiers run locally (see README.md).
# The gate itself is tools/check.sh, so a developer machine runs exactly what CI runs.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17.0.20+8
          cache: gradle

      # AGP must not fetch SDK components itself (android.builder.sdkDownload=false): they would arrive outside
      # dependency verification. The runner's preinstalled sdkmanager installs the exact packages the build records;
      # tools/check.sh then fails if either revision differs from docs/build-decision-record.md.
      - name: Install the recorded Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # The step shell runs with pipefail; `yes` dies of SIGPIPE when sdkmanager stops reading.
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Gate (tools/check.sh)
        run: tools/check.sh
